  /* rolling digit (odometer): เลขเก่าเลื่อนขึ้นหาย เลขใหม่เลื่อนขึ้นมาจากล่าง */
  :root{--roll:100%}

  @keyframes chipX{from{transform:translateX(var(--x0))}to{transform:translateX(var(--x1))}}

function rollInfo(key,val){

  return st.from!==null&&now-st.t0<280?{from:st.from,delay:-(now-st.t0)}:null;
}

const RV_ON=('IntersectionObserver' in window)&&!window.matchMedia('(prefers-reduced-motion: reduce)').matches;
if(RV_ON)document.documentElement.classList.add('rv-on');
let RV_IO=null;
function setupReveal(mode){
  if(RV_IO){RV_IO.disconnect();RV_IO=null;}
  if(!RV_ON)return;
  const cards=[...document.querySelectorAll('#view .rv')].filter(c=>!c.classList.contains('in'));
  if(!cards.length)return;
  const edge=window.innerHeight-40;
  const todo=[];
  cards.forEach(c=>{
    const r=c.getBoundingClientRect();
    if(mode==='page'&&r.top<edge&&r.bottom>0){c.classList.add('in','now');S.revealed.add(c.dataset.code);} // อยู่ในจอตั้งแต่โหลด = โผล่ทันที ไม่มีจังหวะว่าง
    else todo.push(c);
  });
  if(!todo.length)return;
  RV_IO=new IntersectionObserver(entries=>{
    const hit=entries.filter(e=>e.isIntersecting).sort((a,b)=>a.boundingClientRect.top-b.boundingClientRect.top||a.boundingClientRect.left-b.boundingClientRect.left);
    hit.forEach((e,i)=>{ // stagger นับเฉพาะการ์ดที่เข้าจอพร้อมกันในรอบนี้
      e.target.style.setProperty('--rd',Math.min(i*35,280)+'ms');
      e.target.classList.add('in');S.revealed.add(e.target.dataset.code);RV_IO.unobserve(e.target);
    });
  },{threshold:.15,rootMargin:'0px 0px -40px 0px'});
  todo.forEach(c=>RV_IO.observe(c));
}

function xlHandleFile(f){
  const x=S.xl;x.err=null;x.ack=false;
  if(!f)return;
  if(!/\.xlsx$/i.test(f.name)){x.err='รองรับเฉพาะไฟล์ .xlsx';x.st='pick';return render();}
  if(f.size>2*1024*1024){x.err='ไฟล์ใหญ่เกิน 2 MB ('+fmtSize(f.size)+') ลดจำนวนแถวหรือแบ่งเป็นหลายไฟล์';x.st='pick';return render();}
  x.file={name:f.name,size:f.size};x.st='checking';render();
  clearTimeout(xlHandleFile.h);xlHandleFile.h=setTimeout(()=>{if(S.xl.st==='checking'){S.xl.st='preview';S.xl.scn='err';render();}},1300);
}
function xlApply(){
  const x=S.xl,R=xlRows().filter(r=>r.st!=='err'),id='IMP-0012';
  const lots=R.map(r=>[r.code,+r.qty,r.exp]);
  lots.forEach(([c,q,e])=>{const p=byCode(c);if(p)p.lots.push({id:'L-X'+Math.random().toString(36).slice(2,6).toUpperCase(),recv:'2026-10-09',qty:q,remain:q,exp:e});});
  const at='2026-10-09 '+new Date().toTimeString().slice(0,5);
  DB.batches.unshift({id,file:(x.file||{name:'stock-oct-w2.xlsx'}).name,by:EMAIL.staff,at,lots});
  x.result={id,file:DB.batches[0].file,lots:lots.length,qty:lots.reduce((t,l)=>t+l[1],0)};
  x.st='done';x.openBatch=id;
  toast(`นำเข้า ${x.result.lots} ล็อต รวม ${x.result.qty} ชิ้น เรียบร้อย`);render();
}

/* ---------- render ---------- */
function render(){
  S.now=new Set();
  if(S.anim==='page'||S.anim==='grid')S.revealed.clear(); // นำทาง/กรอง = เริ่มชุดการ์ดใหม่ ต้องเคลียร์ก่อน card() อ่านค่า
  const pg=PAGES.find(p=>p.id===S.page);
  document.getElementById('roleGuest').className='px-3 py-1 rounded-md '+(S.role==='guest'?'bg-white text-stone-900 font-medium':'text-stone-300');
  document.getElementById('roleCustomer').className='px-3 py-1 rounded-md '+(S.role==='customer'?'bg-white text-stone-900 font-medium':'text-stone-300');
  document.getElementById('roleStaff').className='px-3 py-1 rounded-md '+(S.role==='staff'?'bg-white text-stone-900 font-medium':'text-stone-300');
  document.getElementById('pageTabs').innerHTML=PAGES.map(p=>`<button data-go="${p.id}" class="whitespace-nowrap rounded-md px-2.5 py-1 text-xs ${S.page===p.id?'bg-emerald-700 text-white':'text-stone-300 hover:bg-stone-800'}">${p.label}</button>`).join('');
  renderNav();
  const v=document.getElementById('view');
  let html;
  if(!allowed(pg)) html=forbidden();
  else html={login:pageLogin,shop:pageShop,cart:pageCart,check:pageCheck,confirm:pageConfirm,orders:pageOrders,products:pageProducts,import:()=>pageImport(S.prefCode)}[S.page]();
  const ae=document.activeElement,focusId=ae&&['q','gName','gContact'].includes(ae.id)?ae.id:null;
  const pos=focusId?ae.selectionStart:0;
  v.classList.toggle('anim-page',S.anim==='page');v.classList.toggle('anim-grid',!!S.anim);
  v.innerHTML=html;
  if(focusId){const q=document.getElementById(focusId);if(q){q.focus();try{q.setSelectionRange(pos,pos);}catch(_){}}}
  document.getElementById('drawerRoot').innerHTML=S.drawer?drawerLots(S.drawer):'';
  document.getElementById('modalRoot').innerHTML=S.modal!==null?modalEdit(S.modal):'';
  if(S.page==='import' && allowed(pg)) bindImport();
  setupReveal(S.anim);
  S.seen=S.now;S.anim=null;S.bump=null;S.expandCode=null;
}
function go(id){Object.keys(S.rolls).forEach(k=>{if(k.startsWith('card-'))delete S.rolls[k];});S.anim='page';S.lastTotal=undefined;S.page=id;S.drawer=null;S.modal=null;S.cartErr=null;render();window.scrollTo(0,0);}

function bindImport(){
  const code=document.getElementById('iCode'),hint=document.getElementById('iHint');
  if(!code)return;
  const upd=()=>{const p=byCode(code.value.trim());hint.innerHTML=!code.value.trim()?'':p?`<span class="text-emerald-800">✓ ${esc(p.name)} · ขายได้ ${sellable(p)} ชิ้น</span>`:`<span class="text-rose-700">ไม่พบรหัสสินค้านี้</span>`;};
  code.addEventListener('input',upd);upd();
  document.getElementById('impForm').addEventListener('submit',e=>{
    e.preventDefault();
    const p=byCode(code.value.trim()),qty=+document.getElementById('iQty').value,exp=document.getElementById('iExp').value,err=document.getElementById('iErr');
    if(!p) return err.textContent='ไม่พบรหัสสินค้านี้ กรุณาเลือกจากรายการ';
    if(!(qty>=1)) return err.textContent='จำนวนต้องมากกว่า 0';
    if(!exp) return err.textContent='กรุณาระบุวันหมดอายุ';
    if(daysTo(exp)<0) return err.textContent='วันหมดอายุผ่านไปแล้ว ล็อตนี้จะขายไม่ได้ กรุณาตรวจสอบวันที่';
    p.lots.push({id:'L-'+Date.now().toString().slice(-6),recv:'2026-10-09',qty,remain:qty,exp});
    DB.imports.unshift({at:'2026-10-09 '+new Date().toTimeString().slice(0,5),code:p.code,name:p.name,qty,exp,by:EMAIL.staff});
    toast(`นำเข้า ${p.name} +${qty} ชิ้น เรียบร้อย`);S.prefCode='';render();
  });
}

document.addEventListener('click',e=>{
  const t=e.target.closest('button,[data-close-drawer],[data-close-modal]');if(!t)return;

  if('type' in D){S.type=D.type;S.anim='grid';return render();}
  if('clear' in D){S.q='';S.type='ทั้งหมด';S.anim='grid';return render();}

    if(n<1)return;const numEl=document.querySelector('[data-stepnum="'+D.add+'"]'),before=cartCount();i?i.qty+=n:DB.cart.push({code:D.add,qty:n});S.pick[D.add]=1;S.flash={code:D.add,n,ts:Date.now()};clearTimeout(S.fh);S.fh=setTimeout(()=>{S.flash=null;if(S.page==='shop')render();},2000);S.stepReset={code:D.add,ts:Date.now()};flyChip(numEl,n,before,D.add);return render();}

  if('pdec' in D){S.pick[D.pdec]=Math.max(1,(S.pick[D.pdec]||1)-1);S.bump='p-'+D.pdec;return render();}
  if('inc' in D){S.bump='c-'+D.inc;DB.cart.find(x=>x.code===D.inc).qty++;if(S.cartErr)S.cartErr=validateCart();return render();}
  if('dec' in D){S.bump='c-'+D.dec;const i=DB.cart.find(x=>x.code===D.dec);if(i.qty>1)i.qty--;if(S.cartErr)S.cartErr=validateCart();return render();}
  if('del' in D){const doIt=()=>{const idx=DB.cart.findIndex(x=>x.code===D.del);if(idx<0)return;const item=DB.cart[idx];S.undo={items:[{item,idx}]};DB.cart.splice(idx,1);if(S.cartErr)S.cartErr=validateCart();toastUndo('ลบ '+byCode(item.code).name+' แล้ว');return render();};const row=document.querySelector(`[data-row="${D.del}"]`);if(row&&!S.deleting){S.deleting=true;row.classList.add('collapsing');setTimeout(()=>{S.deleting=false;doIt();},REDUCED()?120:200);return;}doIt();return;}
  if('undo' in D){if(S.undo){S.expandCode=S.undo.items[0].item.code;S.undo.items.forEach(({item,idx})=>DB.cart.splice(Math.min(idx,DB.cart.length),0,item));S.undo=null;if(S.cartErr)S.cartErr=validateCart();}document.getElementById('toast').classList.remove('show');return render();}
  if('fit' in D){DB.cart.find(x=>x.code===D.fit).qty=sellable(byCode(D.fit));S.cartErr=validateCart();return render();}
  if('fixall' in D){DB.cart=DB.cart.filter(i=>sellable(byCode(i.code))>0);DB.cart.forEach(i=>i.qty=Math.min(i.qty,sellable(byCode(i.code))));S.cartErr=validateCart();toast('ปรับจำนวนให้เท่าที่ขายได้แล้ว ตรวจยอดรวมอีกครั้งก่อนสั่งซื้อ');return render();}
  if('impmode' in D){S.impMode=D.impmode;S.drawer=null;return render();}
  if('xlsample' in D){return xlHandleFile({name:'stock-oct-w2.xlsx',size:48*1024});}
  if('xltemplate' in D){toast('ดาวน์โหลด stock-import-template.xlsx (mockup)');return;}
  if('xlnew' in D){Object.assign(S.xl,{st:'pick',file:null,err:null,ack:false,result:null});clearTimeout(xlHandleFile.h);return render();}
  if('xls' in D){const x=S.xl,k=D.xls;x.err=null;x.ack=false;if(!x.file)x.file={name:'stock-oct-w2.xlsx',size:48*1024};clearTimeout(xlHandleFile.h);
    if(k==='prev-err'){x.st='preview';x.scn='err';}else if(k==='prev-ok'){x.st='preview';x.scn='ok';}else x.st=k;
    if(k==='done'){x.scn='ok';x.result={id:'IMP-0012',file:x.file.name,lots:xlStat().lots,qty:xlStat().qty};}
    if(k==='pick')x.file=null;
    return render();}
  if('xlcreate' in D){S.page='products';S.modal='';S.anim='page';return render();}
  if('xlhist' in D){const h=document.getElementById('xlHistory');if(h)h.scrollIntoView({behavior:REDUCED()?'auto':'smooth',block:'start'});else{S.xl.st='pick';render();}return;}
  if('xlbatch' in D){S.xl.openBatch=S.xl.openBatch===D.xlbatch?null:D.xlbatch;return render();}

  if('edit' in D){S.modal=D.edit;return render();}

setInterval(()=>{if(S.cool>0){S.cool--;const b=document.getElementById('resendBtn');if(b){b.disabled=S.cool>0;b.textContent=S.cool>0?`ส่งอีกครั้งได้ใน ${S.cool} วินาที`:'ส่งลิงก์อีกครั้ง';}}},1000);
document.addEventListener('submit',e=>{
  if(e.target.id==='loginForm'){e.preventDefault();const em=document.getElementById('lEmail').value.trim();
    S.role=em.startsWith('staff')?'staff':'customer';go(S.role==='staff'?'products':'shop');}
  if(e.target.id==='prodForm'){e.preventDefault();S.modal=null;toast('บันทึกสินค้าแล้ว (mockup)');render();}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&(S.drawer||S.modal!==null)){S.drawer=null;S.modal=null;render();}});
document.getElementById('roleGuest').onclick=()=>{S.role='guest';go(S.page==='login'?'login':'shop');};
document.getElementById('roleCustomer').onclick=()=>{S.role='customer';go(S.page==='login'?'login':'shop');};
document.getElementById('roleStaff').onclick=()=>{S.role='staff';go(S.page==='login'?'login':'products');};
document.getElementById('resetBtn').onclick=()=>{DB=seed();S.cartErr=null;S.q='';S.type='ทั้งหมด';render();toast('รีเซ็ตข้อมูลตัวอย่างแล้ว');};
S.anim='page';render();
</script>
</body>
</html>
